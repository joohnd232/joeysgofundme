<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 12px;
    }
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
      padding: 8px 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-label { font-size: 11px; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.5px; }
    .stat-val { font-size: 20px; font-weight: 700; font-family: monospace; color: #38bdf8; }
    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      background: #020617;
      border: 2px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 28px; font-weight: 800; color: #38bdf8; }
    .overlay p { font-size: 14px; color: #cbd5e1; max-width: 280px; text-align: center; }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #1d4ed8; transform: translateY(-1px); }
    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      gap: 8px;
    }
    .mobile-controls {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(2, 44px);
      gap: 6px;
      margin-top: 12px;
    }
    .m-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 6px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .m-btn:active { background: #38bdf8; color: #020617; }
    @media(min-width: 600px) {
      .mobile-controls { display: none; }
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="stat">
      <span class="stat-label">Score</span>
      <span id="scoreVal" class="stat-val">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Speed</span>
      <span id="speedVal" class="stat-val">1x</span>
    </div>
    <div class="stat">
      <span class="stat-label">Best</span>
      <span id="bestVal" class="stat-val">0</span>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div id="startOverlay" class="overlay">
      <h2>SNAKE CLASSIC</h2>
      <p>Eat glowing apples, grow your tail, and avoid crashing into walls or yourself!</p>
      <button class="btn" id="startBtn">Play Game</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="color: #f43f5e;">GAME OVER</h2>
      <p id="finalScoreText">You scored 0 points!</p>
      <button class="btn" id="restartBtn">Play Again</button>
    </div>
  </div>

  <div class="controls-hint">
    <span>Controls: Arrow Keys / WASD · Space to Pause</span>
  </div>

  <div class="mobile-controls">
    <div></div>
    <button class="m-btn" id="upBtn">▲</button>
    <div></div>
    <button class="m-btn" id="leftBtn">◀</button>
    <button class="m-btn" id="downBtn">▼</button>
    <button class="m-btn" id="rightBtn">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const speedVal = document.getElementById('speedVal');
    const bestVal = document.getElementById('bestVal');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreText = document.getElementById('finalScoreText');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    // Web Audio synthesizer for clean responsive sounds
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playSound(freq, duration, type='sine') {
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const GRID = 20;
    const TILES = 20;
    let snake = [];
    let food = { x: 5, y: 5, isSpecial: false };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let best = parseInt(localStorage.getItem('unblocked_snake_best') || '0', 10);
    bestVal.textContent = best;
    let gameLoop = null;
    let baseSpeed = 120;
    let isPaused = false;
    let isRunning = false;

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      scoreVal.textContent = '0';
      speedVal.textContent = '1x';
      spawnFood();
      isRunning = true;
      isPaused = false;
      gameOverOverlay.classList.add('hidden');
      startOverlay.classList.add('hidden');
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, baseSpeed);
      draw();
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILES);
        food.y = Math.floor(Math.random() * TILES);
        valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
      }
      food.isSpecial = Math.random() < 0.2;
    }

    function update() {
      if (isPaused || !isRunning) return;
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= TILES || head.y < 0 || head.y >= TILES) {
        handleGameOver();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        handleGameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        const points = food.isSpecial ? 30 : 10;
        score += points;
        scoreVal.textContent = score;
        if (score > best) {
          best = score;
          bestVal.textContent = best;
          localStorage.setItem('unblocked_snake_best', best.toString());
        }
        playSound(food.isSpecial ? 660 : 440, 0.12, 'square');
        spawnFood();

        // Speed increase every 50 points
        const speedLevel = Math.min(5, 1 + Math.floor(score / 50));
        speedVal.textContent = speedLevel + 'x';
        const newSpeed = Math.max(60, baseSpeed - (speedLevel - 1) * 12);
        clearInterval(gameLoop);
        gameLoop = setInterval(update, newSpeed);
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid subtle lines
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += GRID) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      // Food
      if (food.isSpecial) {
        ctx.fillStyle = '#f59e0b';
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 10;
      } else {
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#f87171';
        ctx.shadowBlur = 8;
      }
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((seg, i) => {
        if (i === 0) {
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = '#0284c7';
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = '#0284c7';
          ctx.shadowBlur = 0;
        }
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
      });
      ctx.shadowBlur = 0;
    }

    function handleGameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      playSound(180, 0.35, 'sawtooth');
      finalScoreText.textContent = `Score: ${score} · Best: ${best}`;
      gameOverOverlay.classList.remove('hidden');
    }

    function changeDir(nx, ny) {
      if (!isRunning) return;
      if (nx !== 0 && dx === 0) { nextDx = nx; nextDy = 0; }
      if (ny !== 0 && dy === 0) { nextDx = 0; nextDy = ny; }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.code === 'Space') {
        if (isRunning) {
          isPaused = !isPaused;
        }
        e.preventDefault();
        return;
      }
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': changeDir(0, -1); e.preventDefault(); break;
        case 'ArrowDown': case 's': case 'S': changeDir(0, 1); e.preventDefault(); break;
        case 'ArrowLeft': case 'a': case 'A': changeDir(-1, 0); e.preventDefault(); break;
        case 'ArrowRight': case 'd': case 'D': changeDir(1, 0); e.preventDefault(); break;
      }
    });

    startBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('click', resetGame);

    document.getElementById('upBtn').addEventListener('click', () => changeDir(0, -1));
    document.getElementById('downBtn').addEventListener('click', () => changeDir(0, 1));
    document.getElementById('leftBtn').addEventListener('click', () => changeDir(-1, 0));
    document.getElementById('rightBtn').addEventListener('click', () => changeDir(1, 0));

    draw();
  </script>
</body>
</html>
