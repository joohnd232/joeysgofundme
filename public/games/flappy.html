<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Flyer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
      margin-bottom: 8px;
      padding: 6px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      font-family: monospace;
    }
    .hud-val { color: #f59e0b; font-weight: bold; font-size: 16px; }
    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 9 / 14;
      background: #0ea5e9;
      border: 2px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      overflow: hidden;
      cursor: pointer;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      text-align: center;
      padding: 16px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 26px; font-weight: 800; color: #f59e0b; }
    .overlay p { font-size: 13px; color: #cbd5e1; }
    .btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 9px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #d97706; }
    .controls-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div><span>SCORE: </span><span id="scoreVal" class="hud-val">0</span></div>
    <div><span>BEST: </span><span id="bestVal" class="hud-val">0</span></div>
  </div>

  <div class="canvas-container" id="canvasBox">
    <canvas id="gameCanvas" width="360" height="560"></canvas>
    
    <div id="startOverlay" class="overlay">
      <h2>FLAPPY FLYER</h2>
      <p>Tap / Click or Space to flap wings. Avoid obstacles!</p>
      <button class="btn" id="startBtn">Start Flapping</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="color: #ef4444;">CRASHED!</h2>
      <p id="finalScoreText">Score: 0</p>
      <button class="btn" id="restartBtn">Try Again</button>
    </div>
  </div>

  <div class="controls-hint">
    <span>Click / Tap anywhere or press Space to Jump</span>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal = document.getElementById('bestVal');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreText = document.getElementById('finalScoreText');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const canvasBox = document.getElementById('canvasBox');

    let audioCtx = null;
    function playBeep(freq, dur) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let bird = { x: 80, y: 250, radius: 14, velocity: 0, gravity: 0.38, jump: -6.5 };
    let pipes = [];
    let clouds = [
      { x: 50, y: 80, s: 35 },
      { x: 220, y: 120, s: 45 },
      { x: 340, y: 60, s: 30 }
    ];
    let score = 0;
    let best = parseInt(localStorage.getItem('unblocked_flappy_best') || '0', 10);
    bestVal.textContent = best;
    let frame = 0;
    let isPlaying = false;
    let isDead = false;

    function resetGame() {
      bird.y = 250;
      bird.velocity = 0;
      pipes = [];
      score = 0;
      frame = 0;
      scoreVal.textContent = '0';
      isPlaying = true;
      isDead = false;
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      loop();
    }

    function flap() {
      if (!isPlaying) return;
      bird.velocity = bird.jump;
      playBeep(480, 0.08);
    }

    function loop() {
      if (!isPlaying) return;
      frame++;
      update();
      render();
      if (!isDead) requestAnimationFrame(loop);
    }

    function update() {
      // Bird Physics
      bird.velocity += bird.gravity;
      bird.y += bird.velocity;

      // Ground / Ceiling Hit
      if (bird.y + bird.radius >= 500) {
        die();
        return;
      }
      if (bird.y - bird.radius <= 0) {
        bird.y = bird.radius;
        bird.velocity = 0;
      }

      // Spawn pipes
      if (frame % 90 === 0) {
        const gap = 120;
        const topHeight = Math.floor(Math.random() * (500 - gap - 100)) + 40;
        pipes.push({
          x: 360,
          top: topHeight,
          bottom: 500 - (topHeight + gap),
          passed: false
        });
      }

      // Move pipes
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= 2.5;

        // Collision detection
        if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + 52) {
          if (bird.y - bird.radius < p.top || bird.y + bird.radius > 500 - p.bottom) {
            die();
            return;
          }
        }

        // Score
        if (!p.passed && p.x + 52 < bird.x) {
          p.passed = true;
          score++;
          scoreVal.textContent = score;
          if (score > best) {
            best = score;
            bestVal.textContent = best;
            localStorage.setItem('unblocked_flappy_best', best.toString());
          }
          playBeep(720, 0.12);
        }

        // Remove offscreen
        if (p.x < -60) pipes.splice(i, 1);
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= 0.6;
        if (c.x < -60) c.x = 380;
      });
    }

    function die() {
      isDead = true;
      isPlaying = false;
      playBeep(180, 0.35);
      finalScoreText.textContent = `Score: ${score} · Best: ${best}`;
      gameOverOverlay.classList.remove('hidden');
    }

    function render() {
      // Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, 500);
      skyGrad.addColorStop(0, '#38bdf8');
      skyGrad.addColorStop(1, '#bae6fd');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, 360, 500);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.s, 0, Math.PI * 2);
        ctx.arc(c.x + c.s * 0.7, c.y - 10, c.s * 0.8, 0, Math.PI * 2);
        ctx.arc(c.x + c.s * 1.3, c.y, c.s * 0.7, 0, Math.PI * 2);
        ctx.fill();
      });

      // Pipes
      pipes.forEach(p => {
        ctx.fillStyle = '#16a34a';
        // Top pipe
        ctx.fillRect(p.x, 0, 52, p.top);
        ctx.fillStyle = '#15803d';
        ctx.fillRect(p.x - 3, p.top - 20, 58, 20);

        // Bottom pipe
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x, 500 - p.bottom, 52, p.bottom);
        ctx.fillStyle = '#15803d';
        ctx.fillRect(p.x - 3, 500 - p.bottom, 58, 20);
      });

      // Ground
      ctx.fillStyle = '#65a30d';
      ctx.fillRect(0, 500, 360, 14);
      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, 514, 360, 46);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.velocity * 0.08));
      ctx.rotate(angle);

      // Body
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(6, -4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(8, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.lineTo(18, 4);
      ctx.lineTo(8, 8);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    canvasBox.addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') flap();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.code === 'Space') {
        flap();
        e.preventDefault();
      }
    });

    startBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('click', resetGame);

    render();
  </script>
</body>
</html>
