<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Night Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 540px;
      margin-bottom: 8px;
      font-family: monospace;
      font-size: 15px;
      padding: 6px 14px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 6px;
    }
    .hud-val { color: #f43f5e; font-weight: bold; }
    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 540px;
      aspect-ratio: 16 / 9;
      background: #030712;
      border: 2px solid #1f2937;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      overflow: hidden;
      cursor: pointer;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      text-align: center;
      padding: 16px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 26px; font-weight: 800; color: #f43f5e; }
    .overlay p { font-size: 13px; color: #9ca3af; }
    .btn {
      background: #f43f5e;
      color: white;
      border: none;
      padding: 8px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #e11d48; }
    .controls-hint {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
    }
    .mobile-buttons {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }
    .mb-btn {
      background: #1f2937;
      border: 1px solid #374151;
      color: #f1f5f9;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: bold;
    }
    @media(min-width: 600px) { .mobile-buttons { display: none; } }
  </style>
</head>
<body>
  <div class="hud">
    <div>DISTANCE: <span id="distVal" class="hud-val">0m</span></div>
    <div>HI-SCORE: <span id="bestVal" class="hud-val">0m</span></div>
  </div>

  <div class="canvas-container" id="canvasBox">
    <canvas id="gameCanvas" width="540" height="300"></canvas>
    
    <div id="startOverlay" class="overlay">
      <h2>NIGHT RUNNER</h2>
      <p>Jump over spikes and duck under aerial drones in this endless synthwave sprint!</p>
      <button class="btn" id="startBtn">Run Now</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="color: #ef4444;">COLLISION!</h2>
      <p id="finalScore">Distance: 0m</p>
      <button class="btn" id="restartBtn">Try Again</button>
    </div>
  </div>

  <div class="controls-hint">
    <span>Space / ▲ / W: Jump · ▼ / S: Duck</span>
  </div>

  <div class="mobile-buttons">
    <button class="mb-btn" id="btnJump">▲ JUMP</button>
    <button class="mb-btn" id="btnDuck">▼ DUCK</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const distVal = document.getElementById('distVal');
    const bestVal = document.getElementById('bestVal');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScore = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const canvasBox = document.getElementById('canvasBox');

    let audioCtx = null;
    function playBeep(freq, dur) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    const GROUND_Y = 240;
    let runner = {
      x: 60,
      y: GROUND_Y - 40,
      w: 24,
      h: 40,
      vy: 0,
      gravity: 0.65,
      jumpForce: -12.5,
      isGrounded: true,
      isDucking: false
    };

    let obstacles = [];
    let clouds = [
      { x: 100, y: 50, speed: 0.4 },
      { x: 300, y: 80, speed: 0.5 },
      { x: 480, y: 40, speed: 0.3 }
    ];
    let distance = 0;
    let speed = 5;
    let best = parseInt(localStorage.getItem('unblocked_runner_best') || '0', 10);
    bestVal.textContent = best + 'm';
    let isPlaying = false;
    let frame = 0;

    function resetGame() {
      runner.y = GROUND_Y - 40;
      runner.h = 40;
      runner.vy = 0;
      runner.isGrounded = true;
      runner.isDucking = false;
      obstacles = [];
      distance = 0;
      speed = 5;
      frame = 0;
      isPlaying = true;
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      loop();
    }

    function jump() {
      if (!isPlaying) return;
      if (runner.isGrounded) {
        runner.vy = runner.jumpForce;
        runner.isGrounded = false;
        playBeep(420, 0.08);
      }
    }

    function duck(enable) {
      if (!isPlaying) return;
      runner.isDucking = enable;
      if (enable) {
        runner.h = 22;
        if (runner.isGrounded) runner.y = GROUND_Y - 22;
      } else {
        runner.h = 40;
        if (runner.isGrounded) runner.y = GROUND_Y - 40;
      }
    }

    function loop() {
      if (!isPlaying) return;
      frame++;
      update();
      render();
      requestAnimationFrame(loop);
    }

    function update() {
      distance += Math.floor(speed * 0.2);
      distVal.textContent = distance + 'm';
      if (distance > best) {
        best = distance;
        bestVal.textContent = best + 'm';
        localStorage.setItem('unblocked_runner_best', best.toString());
      }

      // Speed gradually ramps
      speed = Math.min(11, 5 + Math.floor(distance / 200) * 0.5);

      // Physics
      runner.vy += runner.gravity;
      runner.y += runner.vy;

      const groundTarget = runner.isDucking ? GROUND_Y - 22 : GROUND_Y - 40;
      if (runner.y >= groundTarget) {
        runner.y = groundTarget;
        runner.vy = 0;
        runner.isGrounded = true;
      }

      // Obstacle spawner
      if (frame % Math.floor(Math.max(50, 110 - speed * 4)) === 0) {
        const type = Math.random() < 0.35 && distance > 100 ? 'drone' : 'spike';
        if (type === 'spike') {
          obstacles.push({
            x: 540,
            y: GROUND_Y - 32,
            w: 22,
            h: 32,
            type: 'spike'
          });
        } else {
          // Flying drone
          obstacles.push({
            x: 540,
            y: GROUND_Y - 50,
            w: 26,
            h: 18,
            type: 'drone'
          });
        }
      }

      // Obstacles loop
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed;

        // Collision check
        const hitX = runner.x < obs.x + obs.w && runner.x + runner.w > obs.x;
        const hitY = runner.y < obs.y + obs.h && runner.y + runner.h > obs.y;
        if (hitX && hitY) {
          die();
          return;
        }

        if (obs.x < -40) obstacles.splice(i, 1);
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x < -80) c.x = 560;
      });
    }

    function die() {
      isPlaying = false;
      playBeep(140, 0.35);
      finalScore.textContent = `Distance Reached: ${distance}m`;
      gameOverOverlay.classList.remove('hidden');
    }

    function render() {
      // Background synthwave sky
      const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      grad.addColorStop(0, '#1e1b4b');
      grad.addColorStop(1, '#0f172a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant mountains / grid
      ctx.fillStyle = '#312e81';
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(80, 160);
      ctx.lineTo(160, GROUND_Y);
      ctx.lineTo(260, 140);
      ctx.lineTo(380, GROUND_Y);
      ctx.lineTo(470, 170);
      ctx.lineTo(540, GROUND_Y);
      ctx.closePath();
      ctx.fill();

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      clouds.forEach(c => {
        ctx.fillRect(c.x, c.y, 50, 12);
        ctx.fillRect(c.x + 10, c.y - 6, 30, 8);
      });

      // Ground line & road
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(0, GROUND_Y, canvas.width, 3);
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, GROUND_Y + 3, canvas.width, canvas.height - GROUND_Y);

      // Ground dashed marks
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      for (let x = (-(frame * speed) % 40); x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y + 15);
        ctx.lineTo(x + 18, GROUND_Y + 15);
        ctx.stroke();
      }

      // Obstacles
      obstacles.forEach(obs => {
        if (obs.type === 'spike') {
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.moveTo(obs.x + obs.w / 2, obs.y);
          ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
          ctx.lineTo(obs.x, obs.y + obs.h);
          ctx.closePath();
          ctx.fill();
        } else {
          // Drone
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(obs.x + 4, obs.y + 4, obs.w - 8, 4);
        }
      });

      // Runner
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(runner.x, runner.y, runner.w, runner.h);
      // Headband / eye visor
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(runner.x + 4, runner.y + 6, runner.w - 6, 5);
    }

    window.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        jump();
        e.preventDefault();
      }
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        duck(true);
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        duck(false);
      }
    });

    startBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('click', resetGame);
    canvasBox.addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') jump();
    });

    document.getElementById('btnJump').addEventListener('touchstart', e => { e.preventDefault(); jump(); });
    document.getElementById('btnDuck').addEventListener('touchstart', e => { e.preventDefault(); duck(true); });
    document.getElementById('btnDuck').addEventListener('touchend', e => { e.preventDefault(); duck(false); });

    render();
  </script>
</body>
</html>
